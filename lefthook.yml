# yaml-language-server: $schema=https://raw.githubusercontent.com/evilmartians/lefthook/master/schema.json
---
pre-commit:
  commands:
    task:
      run: task pre-commit

commit-msg:
  commands:
    spec-impact:
      run: uv run --locked python scripts/check_specs.py --staged --message-file {1}
      fail_text: "Behavioral changes require specs/traceability or Spec-Impact trailer"

pre-push:
  commands:
    task:
      run: task pre-push
