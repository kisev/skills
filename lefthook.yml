# yaml-language-server: $schema=https://raw.githubusercontent.com/evilmartians/lefthook/master/schema.json
---
pre-commit:
  commands:
    staged-checks:
      run: task pre-commit
      fail_text: "Fast staged checks failed; the complete gate still runs at pre-push"

commit-msg:
  commands:
    spec-impact:
      run: uv run --locked python scripts/check_specs.py --staged --message-file {1}
      fail_text: "Behavioral changes require specs/traceability or Spec-Impact trailer"

pre-push:
  commands:
    single-local-gate:
      run: task pre-push
      fail_text: "The single complete local push gate failed"
