# yaml-language-server: $schema=https://raw.githubusercontent.com/evilmartians/lefthook/master/schema.json
---
glob_matcher: doublestar

pre-commit:
  parallel: true
  files: git diff --cached --name-only --diff-filter=ACMR
  jobs:
    - name: secrets-scan
      run: mise exec -- gitleaks git --pre-commit --staged --no-banner --redact

    - name: lint
      group:
        parallel: true
        jobs:
          - name: yaml
            glob: "**/*.{yml,yaml}"
            run: mise exec -- yamllint {files}

          - name: github-actions
            glob: ".github/workflows/*.{yml,yaml}"
            run: mise exec -- actionlint {files}

          - name: toml
            glob: "**/*.toml"
            run: |
              mise exec -- tombi lint {files}
              mise exec -- tombi format --check {files}

          - name: markdown
            glob: "**/*.md"
            # Vendored CLI-managed OpenSpec skills (see .fdignore): same
            # documented exclusion as the fd-driven gates.
            exclude: ".agents/skills/openspec-*/**"
            run: |
              NPM_CONFIG_PREFIX="$(mise where npm:remark-cli)" mise exec -- remark {files} --no-stdout --frail --quiet
              mise exec -- markdownlint-cli2 --no-globs {files}

          - name: python
            glob: "**/*.py"
            run: |
              mise exec -- uv run --locked ruff check --force-exclude {files}
              mise exec -- uv run --locked ruff format --check --force-exclude {files}

          - name: javascript-typescript
            glob: "**/*.{js,mjs,cjs,ts,mts,cts,jsx,tsx}"
            run: |
              mise exec -- oxlint {files}
              mise exec -- oxfmt --check {files}

          - name: json
            glob: "**/*.{json,jsonc,json5}"
            exclude: "**/package-lock.json"
            run: mise exec -- oxfmt --check {files}

          - name: shell
            glob: "**/*.sh"
            run: |
              mise exec -- shfmt -d {files}
              mise exec -- shellcheck {files}

          - name: editorconfig
            glob: "**/*"
            run: mise exec -- editorconfig-checker {files}

    - name: types
      group:
        parallel: true
        jobs:
          - name: python
            glob: "**/*.py"
            exclude:
              - ".agents/skills/openspec-*/**"
              - "apps/**"
            run: mise exec -- uv run --locked mypy {files}

          - name: safe-fs
            glob: "packages/safe-fs/**/*.{ts,tsx,mts,cts}"
            run: mise exec -- tsc --project packages/safe-fs/tsconfig.json

          - name: memomatic
            glob: "apps/memomatic/**/*.{ts,tsx,mts,cts}"
            run: mise exec -- tsc --project apps/memomatic/tsconfig.json --noEmit

          - name: taskmatic
            glob: "apps/taskmatic/**/*.{ts,tsx,mts,cts}"
            run: mise exec -- tsc --project apps/taskmatic/tsconfig.json --noEmit

          - name: agentomatic
            glob: "packages/agentomatic/**/*.{ts,tsx,mts,cts}"
            run: mise exec -- tsc --project packages/agentomatic/tsconfig.json --noEmit

    - name: tests
      group:
        parallel: true
        jobs:
          - name: python
            glob: "**/{test_*.py,*_test.py}"
            exclude:
              - ".agents/skills/openspec-*/**"
              - "apps/**"
            # Changed test files run directly; a staged module with no
            # collected tests (exit code 5) is not a failure, the full
            # suites stay owned by pre-push and CI.
            run: sh -c 'mise exec -- uv run --locked pytest "$@" || test "$?" -eq 5' _ {files}

          - name: reviewmatic
            root: apps/reviewmatic/
            glob: "**/{test_*.py,*_test.py}"
            run: mise exec -- uv run --locked pytest {files}

          - name: shopmatic
            root: apps/shopmatic/
            glob: "**/{test_*.py,*_test.py}"
            run: mise exec -- uv run --locked pytest {files}

          - name: agentomatic
            glob: "packages/agentomatic/**"
            # Emit without clean-dist: parallel pre-commit jobs read the
            # workspace dist type declarations, so nothing may delete them.
            run: |
              mise exec -- tsc --project packages/agentomatic/tsconfig.json
              mise exec -- node packages/agentomatic/dist/generate-assets.js
              mise exec -- npm --prefix packages/agentomatic test

          - name: memomatic
            glob: "apps/memomatic/**"
            run: |
              mise exec -- tsc --project apps/memomatic/tsconfig.json
              mise exec -- npm --prefix apps/memomatic test

          - name: taskmatic
            glob: "apps/taskmatic/**"
            run: |
              mise exec -- tsc --project apps/taskmatic/tsconfig.json
              mise exec -- npm --prefix apps/taskmatic test

    - name: configuration
      group:
        parallel: true
        jobs:
          - name: markdown
            glob:
              - ".markdownlint.yml"
              - ".remarkrc.yml"
              - ".fdignore"
            run: task markdown:lint

          - name: yaml
            glob: ".yamllint.yml"
            run: task yaml:lint

          - name: toml
            glob: ".tombi.toml"
            run: task toml:lint

          - name: editorconfig
            glob:
              - ".editorconfig"
              - ".editorconfig-checker.json"
            run: task editorconfig:lint

          - name: lefthook
            glob: "lefthook.yml"
            run: mise exec -- lefthook validate

          - name: gates
            glob:
              - ".github/workflows/ci.yml"
              - "gate-registry.json"
              - "lefthook.yml"
              - "mise.toml"
              - "taskfile.yml"
            run: task gates:check

          - name: python-lock
            glob:
              - "pyproject.toml"
              - "uv.lock"
            run: mise exec -- uv lock --check

          - name: tools
            glob: "mise.toml"
            run: mise ls --current --local

commit-msg:
  jobs:
    - name: commitlint
      run: mise exec -- commitlint --edit {1}

pre-push:
  parallel: true
  files: git diff --name-only @{upstream} HEAD 2>/dev/null || git ls-files
  jobs:
    - name: core
      run: |
        for variable in $(git rev-parse --local-env-vars); do
          unset "$variable"
        done
        task check:core
      fail_text: "The local push gate failed"

    - name: python-test
      glob:
        # @gates:begin glob:python-test
        - "**/*.py"
        - "**/*.schema.json"
        - "skills/**"
        - "shared/**"
        - "scripts/**"
        - "tests/**"
        - "pyproject.toml"
        - "uv.lock"
        - "gate-registry.json"
        - "lefthook.yml"
        - "mise.toml"
        - "taskfile.yml"
        # @gates:end
      run: |
        for variable in $(git rev-parse --local-env-vars); do
          unset "$variable"
        done
        task python:test
      fail_text: "The local push gate failed"

    - name: reviewmatic-check
      glob:
        # @gates:begin glob:reviewmatic-check
        - "apps/reviewmatic/**"
        - "shared/references/portable_gitlab/**"
        - "shared/references/state_artifacts.py"
        - "shared/references/mutation_process.py"
        - "shared/manifest.json"
        - "gate-registry.json"
        - "lefthook.yml"
        - "mise.toml"
        - "taskfile.yml"
        # @gates:end
      run: |
        for variable in $(git rev-parse --local-env-vars); do
          unset "$variable"
        done
        task reviewmatic:check
      fail_text: "The local push gate failed"

    - name: reviewmatic-smoke
      glob:
        # @gates:begin glob:reviewmatic-smoke
        - "apps/reviewmatic/**"
        - "gate-registry.json"
        - "lefthook.yml"
        - "mise.toml"
        - "taskfile.yml"
        # @gates:end
      run: |
        for variable in $(git rev-parse --local-env-vars); do
          unset "$variable"
        done
        task reviewmatic:smoke
      fail_text: "The local push gate failed"

    - name: shopmatic-check
      glob:
        # @gates:begin glob:shopmatic-check
        - "apps/shopmatic/**"
        - "gate-registry.json"
        - "lefthook.yml"
        - "mise.toml"
        - "taskfile.yml"
        # @gates:end
      run: |
        for variable in $(git rev-parse --local-env-vars); do
          unset "$variable"
        done
        task shopmatic:check
      fail_text: "The local push gate failed"

    - name: package-check
      glob:
        # @gates:begin glob:package-check
        - "packages/**"
        - "apps/**"
        - "shared/**"
        - "scripts/**"
        - "package.json"
        - "package-lock.json"
        - "gate-registry.json"
        - "lefthook.yml"
        - "mise.toml"
        - "taskfile.yml"
        # @gates:end
      run: |
        for variable in $(git rev-parse --local-env-vars); do
          unset "$variable"
        done
        task package:check
      fail_text: "The local push gate failed"

    - name: package-smoke
      glob:
        # @gates:begin glob:package-smoke
        - "packages/**"
        - "apps/**"
        - "shared/**"
        - "scripts/**"
        - "package.json"
        - "package-lock.json"
        - "gate-registry.json"
        - "lefthook.yml"
        - "mise.toml"
        - "taskfile.yml"
        # @gates:end
      run: |
        for variable in $(git rev-parse --local-env-vars); do
          unset "$variable"
        done
        task package:smoke
      fail_text: "The local push gate failed"
