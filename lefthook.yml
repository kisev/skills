# yaml-language-server: $schema=https://raw.githubusercontent.com/evilmartians/lefthook/master/schema.json
---
glob_matcher: doublestar

pre-commit:
  parallel: true
  files: git diff --cached --name-only --diff-filter=ACMR
  jobs:
    - name: security
      run: mise exec -- gitleaks git --pre-commit --staged --no-banner --redact

    - name: lint
      group:
        parallel: true
        jobs:
          - name: yaml
            glob: "**/*.{yml,yaml}"
            run: mise exec -- yamllint {files}

          - name: github-actions
            glob: ".github/workflows/*.{yml,yaml}"
            run: mise exec -- actionlint {files}

          - name: toml
            glob: "**/*.toml"
            run: |
              mise exec -- tombi lint {files}
              mise exec -- tombi format --check {files}

          - name: markdown
            glob: "**/*.md"
            run: |
              NPM_CONFIG_PREFIX="$(mise where npm:remark-cli)" mise exec -- remark {files} --no-stdout --frail --quiet
              mise exec -- markdownlint-cli2 --no-globs {files}

          - name: python
            glob: "**/*.py"
            run: |
              mise exec -- uv run --locked ruff check --force-exclude {files}
              mise exec -- uv run --locked ruff format --check --force-exclude {files}

          - name: javascript-typescript
            glob: "**/*.{js,mjs,cjs,ts,mts,cts,jsx,tsx}"
            run: |
              mise exec -- oxlint {files}
              mise exec -- oxfmt --check {files}

          - name: json
            glob: "**/*.{json,jsonc,json5}"
            exclude: "**/package-lock.json"
            run: mise exec -- oxfmt --check {files}

          - name: shell
            glob: "**/*.sh"
            run: |
              mise exec -- shfmt -d {files}
              mise exec -- shellcheck {files}

          - name: editorconfig
            glob: "**/*"
            run: mise exec -- editorconfig-checker {files}

    - name: configuration
      group:
        parallel: true
        jobs:
          - name: markdown
            glob:
              - ".markdownlint.yml"
              - ".remarkrc.yml"
            run: task lint:markdown

          - name: yaml
            glob: ".yamllint.yml"
            run: task lint:yaml

          - name: toml
            glob: ".tombi.toml"
            run: task lint:toml

          - name: editorconfig
            glob:
              - ".editorconfig"
              - ".editorconfig-checker.json"
            run: task lint:editorconfig

          - name: lefthook
            glob: "lefthook.yml"
            run: mise exec -- lefthook validate

          - name: gates
            glob:
              - ".github/workflows/ci.yml"
              - "gate-registry.json"
              - "lefthook.yml"
              - "mise.toml"
              - "taskfile.yml"
            run: task gates:check

          - name: python-lock
            glob:
              - "pyproject.toml"
              - "uv.lock"
            run: mise exec -- uv lock --check

          - name: tools
            glob: "mise.toml"
            run: mise ls --current --local

commit-msg:
  jobs:
    - name: commitlint
      run: mise exec -- commitlint --edit {1}

pre-push:
  parallel: false
  files: git diff --name-only @{upstream} HEAD 2>/dev/null || git ls-files
  jobs:
    - name: core
      run: |
        for variable in $(git rev-parse --local-env-vars); do
          unset "$variable"
        done
        task check:core
      fail_text: "The local push gate failed"

    - name: python-tests
      glob:
        # @gates:begin glob:python-tests
        - "**/*.py"
        - "**/*.schema.json"
        - "skills/**"
        - "shared/**"
        - "scripts/**"
        - "tests/**"
        - "pyproject.toml"
        - "uv.lock"
        - "gate-registry.json"
        - "lefthook.yml"
        - "mise.toml"
        - "taskfile.yml"
        # @gates:end
      run: |
        for variable in $(git rev-parse --local-env-vars); do
          unset "$variable"
        done
        task test:python
      fail_text: "The local push gate failed"

    - name: reviewmatic
      glob:
        # @gates:begin glob:reviewmatic
        - "apps/reviewmatic/**"
        - "shared/references/portable_gitlab/**"
        - "shared/references/state_artifacts.py"
        - "shared/references/mutation_process.py"
        - "shared/manifest.json"
        - "gate-registry.json"
        - "lefthook.yml"
        - "mise.toml"
        - "taskfile.yml"
        # @gates:end
      run: |
        for variable in $(git rev-parse --local-env-vars); do
          unset "$variable"
        done
        task reviewmatic:check
      fail_text: "The local push gate failed"

    - name: shopmatic
      glob:
        # @gates:begin glob:shopmatic
        - "apps/shopmatic/**"
        - "gate-registry.json"
        - "lefthook.yml"
        - "mise.toml"
        - "taskfile.yml"
        # @gates:end
      run: |
        for variable in $(git rev-parse --local-env-vars); do
          unset "$variable"
        done
        task shopmatic:check
      fail_text: "The local push gate failed"

    - name: npm-packages
      glob:
        # @gates:begin glob:npm-packages
        - "packages/**"
        - "apps/**"
        - "shared/**"
        - "scripts/**"
        - "package.json"
        - "package-lock.json"
        - "gate-registry.json"
        - "lefthook.yml"
        - "mise.toml"
        - "taskfile.yml"
        # @gates:end
      run: |
        for variable in $(git rev-parse --local-env-vars); do
          unset "$variable"
        done
        task package:check
      fail_text: "The local push gate failed"

    - name: consumer-smoke
      glob:
        # @gates:begin glob:consumer-smoke
        - "packages/**"
        - "apps/**"
        - "shared/**"
        - "scripts/**"
        - "package.json"
        - "package-lock.json"
        - "gate-registry.json"
        - "lefthook.yml"
        - "mise.toml"
        - "taskfile.yml"
        # @gates:end
      run: |
        for variable in $(git rev-parse --local-env-vars); do
          unset "$variable"
        done
        task package:consumer-smoke
      fail_text: "The local push gate failed"
