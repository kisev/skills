---
name: CI

"on":
  push:
    branches:
      - "**"
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  branch-policy:
    name: Branch policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      EVENT_NAME: ${{ github.event_name }}
      BASE_REF: ${{ github.base_ref }}
      HEAD_REF: ${{ github.head_ref }}
      HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      REPOSITORY: ${{ github.repository }}
      REF_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
      - name: Restrict the sources merging into main
        run: |
          if test "$EVENT_NAME" = pull_request && test "$BASE_REF" = main; then
            case "$HEAD_REF" in
              dev|release/*|fix/*) ;;
              *)
                echo "pull requests into main must come from dev, release/*, or fix/*" >&2
                exit 1
                ;;
            esac
            test "$HEAD_REPOSITORY" = "$REPOSITORY"
          fi
          if test "$EVENT_NAME" = push && test "$REF_NAME" = main; then
            test "$(git rev-list --parents -n 1 HEAD | wc -w)" -eq 3
          fi

  quality:
    name: ${{ matrix.name }}
    if: ${{ github.event.deleted != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # @gates:begin matrix:quality
          - name: Version contracts
            task: version:check
          - name: Lint
            task: lint
          - name: Type checks
            task: typecheck
          - name: Secret scanning
            task: security
          - name: Documentation
            task: docs:check
          - name: Docs site build
            task: site:build
          - name: Docs site contracts
            task: site:test
          - name: Dependency audit
            task: dependency:audit
          - name: Portable distribution
            task: distribution:check
          - name: OpenCode package
            task: package:check
          - name: Reviewmatic Python package
            task: reviewmatic-py:check
          # @gates:end
    env:
      CHECK_TASK: ${{ matrix.task }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c  # v4.3.0
      - run: task "$CHECK_TASK"

  built-quality:
    name: ${{ matrix.name }}
    if: ${{ github.event.deleted != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # @gates:begin matrix:built-quality
          - name: Locales
            task: locale:check
          - name: Skill validation
            task: skills:validate
          - name: Offline evaluations
            task: eval:check
          - name: Python tests
            task: test:python
          # @gates:end
    env:
      CHECK_TASK: ${{ matrix.task }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c  # v4.3.0
      - run: task build:skills
      - run: task "$CHECK_TASK"

  gate-registry:
    name: Gate registry
    if: ${{ github.event.deleted != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c  # v4.3.0
      - run: task gates:check

  check:
    name: check
    if: ${{ always() }}
    needs:
      - branch-policy
      - gate-registry
      - quality
      - built-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      DELETED_REF: ${{ github.event.deleted }}
      QUALITY_RESULT: ${{ needs.quality.result }}
      BUILT_QUALITY_RESULT: ${{ needs.built-quality.result }}
      BRANCH_POLICY_RESULT: ${{ needs.branch-policy.result }}
      GATE_REGISTRY_RESULT: ${{ needs.gate-registry.result }}
    steps:
      - name: Require every CI gate
        run: |
          if test "$DELETED_REF" = true; then
            exit 0
          fi
          test "$BRANCH_POLICY_RESULT" = success
          test "$GATE_REGISTRY_RESULT" = success
          test "$QUALITY_RESULT" = success
          test "$BUILT_QUALITY_RESULT" = success
