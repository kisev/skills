---
name: CI

"on":
  push:
    branches:
      - "**"
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  branch-policy:
    name: Branch policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      EVENT_NAME: ${{ github.event_name }}
      BASE_REF: ${{ github.base_ref }}
      HEAD_REF: ${{ github.head_ref }}
      HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      REPOSITORY: ${{ github.repository }}
      REF_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
      - name: Require dev as the only source for main
        run: |
          if test "$EVENT_NAME" = pull_request && test "$BASE_REF" = main; then
            test "$HEAD_REF" = dev
            test "$HEAD_REPOSITORY" = "$REPOSITORY"
          fi
          if test "$EVENT_NAME" = push && test "$REF_NAME" = main; then
            test "$(git rev-list --parents -n 1 HEAD | wc -w)" -eq 3
            git merge-base --is-ancestor HEAD^2 origin/dev
          fi

  skills-build:
    name: Materialize portable skills
    if: ${{ github.event.deleted != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c  # v4.3.0
      - run: task build:skills
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: built-skills
          path: .build/skills
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  quality:
    name: ${{ matrix.name }}
    if: ${{ github.event.deleted != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Version contracts
            task: version:check
          - name: Lint
            task: lint
          - name: Type checks
            task: typecheck
          - name: Secret scanning
            task: security
          - name: Portable distribution
            task: distribution:check
          - name: OpenCode package
            task: package:check
    env:
      CHECK_TASK: ${{ matrix.task }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c  # v4.3.0
      - run: task "$CHECK_TASK"

  built-quality:
    name: ${{ matrix.name }}
    if: ${{ github.event.deleted != true }}
    needs: skills-build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Python tests
            task: test:python
          - name: Locales
            task: locale:check
          - name: Skill validation
            task: skills:validate
          - name: Offline evaluations
            task: eval:check
    env:
      CHECK_TASK: ${{ matrix.task }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c  # v4.3.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: built-skills
          path: .build/skills
      - run: task "$CHECK_TASK"

  check:
    name: check
    if: ${{ always() }}
    needs:
      - branch-policy
      - skills-build
      - quality
      - built-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      DELETED_REF: ${{ github.event.deleted }}
      SKILLS_BUILD_RESULT: ${{ needs.skills-build.result }}
      QUALITY_RESULT: ${{ needs.quality.result }}
      BUILT_QUALITY_RESULT: ${{ needs.built-quality.result }}
      BRANCH_POLICY_RESULT: ${{ needs.branch-policy.result }}
    steps:
      - name: Require every CI gate
        run: |
          if test "$DELETED_REF" = true; then
            exit 0
          fi
          test "$BRANCH_POLICY_RESULT" = success
          test "$SKILLS_BUILD_RESULT" = success
          test "$QUALITY_RESULT" = success
          test "$BUILT_QUALITY_RESULT" = success
