name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v5
      - name: Materialization check
        run: python3 scripts/sync_shared.py --check
      - name: Unit, runner, isolated install and workflow contract tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate skills with skills-ref
        run: for skill in skills/*; do uvx --from skills-ref agentskills validate "$skill"; done
      - name: List installable skills
        run: npx --yes skills add . --list
