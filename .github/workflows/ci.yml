---
name: CI

"on":
  push:
    branches:
      - "**"
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  skills-build:
    name: Materialize portable skills
    if: ${{ github.event.deleted != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4.3.0
      - run: task build:skills
      - uses: actions/upload-artifact@v7
        with:
          name: built-skills
          path: .build/skills
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  quality:
    name: ${{ matrix.name }}
    if: ${{ github.event.deleted != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Version contracts
            task: version:check
          - name: Lint
            task: lint
          - name: Type checks
            task: typecheck
          - name: Secret scanning
            task: security
          - name: Portable distribution
            task: distribution:check
          - name: Offline evaluations
            task: eval:check
          - name: OpenCode package
            task: package:check
    env:
      CHECK_TASK: ${{ matrix.task }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v4.3.0
      - run: task "$CHECK_TASK"

  built-quality:
    name: ${{ matrix.name }}
    if: ${{ github.event.deleted != true }}
    needs: skills-build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Python tests
            task: test:python
          - name: Locales
            task: locale:check
          - name: Skill validation
            task: skills:validate
    env:
      CHECK_TASK: ${{ matrix.task }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4.3.0
      - uses: actions/download-artifact@v8
        with:
          name: built-skills
          path: .build/skills
      - run: task "$CHECK_TASK"

  check:
    name: check
    if: ${{ always() }}
    needs:
      - skills-build
      - quality
      - built-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      DELETED_REF: ${{ github.event.deleted }}
      SKILLS_BUILD_RESULT: ${{ needs.skills-build.result }}
      QUALITY_RESULT: ${{ needs.quality.result }}
      BUILT_QUALITY_RESULT: ${{ needs.built-quality.result }}
    steps:
      - name: Require every CI gate
        run: |
          if test "$DELETED_REF" = true; then
            exit 0
          fi
          test "$SKILLS_BUILD_RESULT" = success
          test "$QUALITY_RESULT" = success
          test "$BUILT_QUALITY_RESULT" = success
