---
name: Publish

"on":
  push:
    branches:
      - dev
    tags:
      - "v*"

permissions:
  contents: read
  actions: read

concurrency:
  group: publication
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  stable-preflight:
    name: Stable preflight and artifacts
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_REVISION: ${{ github.sha }}
    outputs:
      pages-artifact: ${{ steps.artifact-names.outputs.pages }}
      deploys-pages: ${{ steps.channel.outputs.deploys-pages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c  # v4.3.0
      - name: Resolve the release channel from the tagged commit
        id: channel
        run: task release:channel -- --github-output
      - name: Bind artifact names to the producing attempt
        id: artifact-names
        run: |
          echo "pages=github-pages-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Run full preflight, compose Pages, and build exact artifacts
        run: task release:prepare
      - name: Upload exact Pages artifact
        if: steps.channel.outputs.deploys-pages == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5
        with:
          name: ${{ steps.artifact-names.outputs.pages }}
          path: .build/pages
          include-hidden-files: true
          retention-days: 14
  stable-pages:
    name: Publish and verify stable Pages
    needs: stable-preflight
    if: needs.stable-preflight.outputs.deploys-pages == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c  # v4.3.0
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5
        with:
          artifact_name: ${{ needs.stable-preflight.outputs.pages-artifact }}
          timeout: 600000
      - name: Verify deployed stable Pages artifact
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: task release:pages:verify

  pypi-publish:
    name: Publish skillmate to PyPI
    needs: stable-preflight
    if: needs.stable-preflight.outputs.deploys-pages == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/skillmate
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c  # v4.3.0
      - name: Build the skillmate distribution for the tagged version
        run: |
          cd apps/skillmate
          mise exec -- uv build
          prefix="dist/skillmate-${RELEASE_TAG#v}-"
          found="$(ls "$prefix"* 2>/dev/null || true)"
          test -n "$found" || {
            echo "built skillmate version does not match $RELEASE_TAG" >&2
            exit 1
          }
      - name: Publish to PyPI through trusted publishing
        run: |
          cd apps/skillmate
          mise exec -- uv publish --trusted-publishing always

  github-release:
    name: Create GitHub Release
    needs:
      - stable-pages
      - pypi-publish
    if: >-
      !cancelled() &&
      startsWith(github.ref, 'refs/tags/v') &&
      (needs.stable-pages.result == 'success' || needs.stable-pages.result == 'skipped') &&
      (needs.pypi-publish.result == 'success' || needs.pypi-publish.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c  # v4.3.0
      - run: task release:github

  dev-preflight:
    name: Dev artifacts
    if: ${{ github.ref == 'refs/heads/dev' && github.event.deleted != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      DEV_REVISION: ${{ github.sha }}
      DEV_RUN_NUMBER: ${{ github.run_number }}
    outputs:
      version: ${{ steps.identity.outputs.version }}
      revision: ${{ steps.identity.outputs.revision }}
      pages-artifact: ${{ steps.artifact-names.outputs.pages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c  # v4.3.0
      - name: Await the terminal CI success for this revision
        env:
          CI_REVISION: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: task dev:await-ci
      - name: Derive immutable dev identity
        id: identity
        run: |
          version="$(task --silent dev:version)"
          echo "DEV_VERSION=$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "revision=$DEV_REVISION" >> "$GITHUB_OUTPUT"
      - name: Bind artifact names to the producing attempt
        id: artifact-names
        run: |
          echo "pages=github-pages-dev-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Build exact dev artifacts and both Pages channels
        run: task dev:prepare
      - name: Upload composed Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5
        with:
          name: ${{ steps.artifact-names.outputs.pages }}
          path: .build/pages
          include-hidden-files: true
          retention-days: 3
  dev-pages:
    name: Publish and verify dev Pages
    needs: dev-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      DEV_VERSION: ${{ needs.dev-preflight.outputs.version }}
      DEV_REVISION: ${{ needs.dev-preflight.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ needs.dev-preflight.outputs.revision }}
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c  # v4.3.0
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5
        with:
          artifact_name: ${{ needs.dev-preflight.outputs.pages-artifact }}
          timeout: 600000
      - name: Verify deployed dev Pages artifact
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: task dev:pages:verify
