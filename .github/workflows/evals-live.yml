---
name: Trusted live evaluations

"on":
  workflow_dispatch:
    inputs:
      host:
        description: Exact host executable (opencode or codex)
        required: true
        type: choice
        options: [opencode, codex]
      model:
        description: Exact model identifier
        required: true
        type: string
      timeout:
        description: Wall-clock limit in seconds
        required: true
        type: string
      max_tokens:
        description: Maximum tokens
        required: true
        type: string
      max_cost:
        description: Maximum cost
        required: true
        type: string

permissions:
  contents: read

jobs:
  evaluate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: trusted-live-evals
    env:
      EVAL_HOST: ${{ inputs.host }}
      EVAL_MODEL: ${{ inputs.model }}
      EVAL_TIMEOUT: ${{ inputs.timeout }}
      EVAL_MAX_TOKENS: ${{ inputs.max_tokens }}
      EVAL_MAX_COST: ${{ inputs.max_cost }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c  # v4.3.0
      - name: Run explicitly trusted live suite
        run: task eval:live
      - name: Upload private evaluation artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: trusted-live-evals
          path: evals/live
          if-no-files-found: error
          retention-days: 7
