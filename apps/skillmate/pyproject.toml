[project]
  name = "skillmate"
  version = "12.0.1"
  description = "Installer-configurator for portable Agent Skills across Codex, Claude, and OpenCode."
  readme = "README.md"
  requires-python = ">=3.12"
  license = "MIT"
  dependencies = []

  [project.scripts]
    skillmate = "skillmate.cli:main"

[dependency-groups]
  dev = ["mypy==2.4.*", "pytest==9.1.*", "ruff==0.17.*"]

[build-system]
  requires = ["hatchling==1.32.*"]
  build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
  packages = ["src/skillmate"]

[tool.hatch.build.targets.sdist]
  include = ["src", "tests", "README.md", "pyproject.toml"]

[tool.mypy]
  python_version = "3.12"
  strict = true
  disallow_any_unimported = true
  explicit_package_bases = true
  mypy_path = ["src", "tests"]
  files = ["src", "tests"]

  [[tool.mypy.overrides]]
    module = ["tests.*"]
    disallow_untyped_defs = false
