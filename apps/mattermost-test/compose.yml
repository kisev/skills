---
name: ${MM_TEST_PROJECT:-mattermost-cards}

services:
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_DB: mattermost
      POSTGRES_USER: mattermost
      # Disposable test database, reachable only on the private Compose network.
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U mattermost -d mattermost]
      interval: 5s
      timeout: 5s
      retries: 20

  mattermost:
    image: ${MM_TEST_IMAGE:-mattermost/mattermost-team-edition:10.10.3}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MM_SERVICESETTINGS_SITEURL: "https://localhost:${MM_TEST_PORT:-8443}"
      MM_SERVICESETTINGS_LISTENADDRESS: :8065
      MM_SERVICESETTINGS_ENABLELOCALMODE: "true"
      MM_SERVICESETTINGS_ENABLEUSERACCESSTOKENS: "true"
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: postgres://mattermost@postgres:5432/mattermost?sslmode=disable&connect_timeout=10
      MM_EMAILSETTINGS_REQUIREEMAILVERIFICATION: "false"
      MM_EMAILSETTINGS_SENDEMAILNOTIFICATIONS: "false"
      MM_LOGSETTINGS_CONSOLELEVEL: ERROR
      MM_LOGSETTINGS_ENABLEFILE: "false"
      MM_LOGSETTINGS_ENABLEDIAGNOSTICS: "false"
      MM_PLUGINSETTINGS_ENABLEMARKETPLACE: "false"
      MM_PLUGINSETTINGS_ENABLE: "false"
    volumes:
      - mattermost-config:/mattermost/config
      - mattermost-socket:/var/tmp
      - mattermost-data:/mattermost/data
      - mattermost-plugins:/mattermost/plugins
      - mattermost-client-plugins:/mattermost/client/plugins
    networks: [backend]
    healthcheck:
      test: [CMD, /mattermost/bin/mmctl, --local, system, status]
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 30

  proxy:
    image: caddy:2.10.2-alpine
    depends_on:
      mattermost:
        condition: service_healthy
    ports:
      - 127.0.0.1:${MM_TEST_PORT:-8443}:443
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [frontend, backend]

  driver:
    image: python:3.12.12-alpine
    profiles: [test]
    volumes:
      - mattermost-socket:/var/tmp:ro
      - ./scripts:/harness:ro
    networks: [backend]
    entrypoint: [python, /harness/socket_api.py]

networks:
  frontend: {}
  backend:
    internal: true

volumes:
  postgres-data: {}
  mattermost-config: {}
  mattermost-socket: {}
  mattermost-data: {}
  mattermost-plugins: {}
  mattermost-client-plugins: {}
  caddy-data: {}
  caddy-config: {}
