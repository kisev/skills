---
name: ${GL_TEST_PROJECT:-gitlab-workflows}

services:
  gitlab:
    image: gitlab/gitlab-ce:18.11.11-ce.0
    shm_size: 256m
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'https://localhost:${GL_TEST_PORT:-443}'
        nginx['listen_port'] = 80
        nginx['listen_https'] = false
        letsencrypt['enable'] = false
        gitlab_rails['gitlab_shell_ssh_port'] = 22
        gitlab_rails['smtp_enable'] = false
        gitlab_rails['usage_ping_enabled'] = false
        gitlab_rails['initial_shared_runners_registration_token'] = nil
        puma['worker_processes'] = 2
        sidekiq['concurrency'] = 5
        prometheus_monitoring['enable'] = false
    volumes:
      - config:/etc/gitlab
      - logs:/var/log/gitlab
      - data:/var/opt/gitlab
    networks: [backend]
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost/-/readiness]
      interval: 10s
      timeout: 10s
      start_period: 300s
      retries: 90

  proxy:
    image: caddy:2.10.2-alpine
    ports:
      - 127.0.0.1:${GL_TEST_PORT:-443}:443
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ca:/data
    networks: [frontend, backend]

  runner:
    image: gitlab/gitlab-runner:v18.11.0
    volumes:
      - runner-config:/etc/gitlab-runner
      - runner-builds:/home/gitlab-runner
    networks: [backend]

networks:
  frontend:
    labels:
      dev.agentomatic.checkout: ${GL_TEST_OWNER:?Use the stand driver}
  backend:
    internal: true
    labels:
      dev.agentomatic.checkout: ${GL_TEST_OWNER:?Use the stand driver}

volumes:
  config:
    labels:
      dev.agentomatic.checkout: ${GL_TEST_OWNER:?Use the stand driver}
  logs:
    labels:
      dev.agentomatic.checkout: ${GL_TEST_OWNER:?Use the stand driver}
  data:
    labels:
      dev.agentomatic.checkout: ${GL_TEST_OWNER:?Use the stand driver}
  ca:
    labels:
      dev.agentomatic.checkout: ${GL_TEST_OWNER:?Use the stand driver}
  runner-config:
    labels:
      dev.agentomatic.checkout: ${GL_TEST_OWNER:?Use the stand driver}
  runner-builds:
    labels:
      dev.agentomatic.checkout: ${GL_TEST_OWNER:?Use the stand driver}
