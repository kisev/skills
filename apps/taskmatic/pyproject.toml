[project]
  name = "taskmatic-web"
  version = "1.0.0"
  description = "Read-only live web board for taskmatic: serves the private SQLite task store locally."
  readme = "README.md"
  requires-python = ">=3.12"
  license = "MIT"
  authors = [{ name = "Kirill Sevriugin" }]
  classifiers = [
    "License :: OSI Approved :: MIT License",
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.12",
  ]

  [project.scripts]
    taskmatic-web = "taskmatic_web.app:main"

[build-system]
  requires = ["hatchling"]
  build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
  packages = ["src/taskmatic_web"]
