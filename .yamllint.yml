# yaml-language-server: $schema=https://www.schemastore.org/yamllint.json
---
ignore-from-file:
  - .gitignore

yaml-files:
  - "*.yaml"
  - "*.yml"
  - .yamllint

# https://yamllint.readthedocs.io/en/stable/rules.html
rules:
  anchors:
    level: error
    forbid-undeclared-aliases: true
    forbid-duplicated-anchors: true
    forbid-unused-anchors: true

  braces:
    level: error
    forbid: non-empty
    min-spaces-inside: 0
    max-spaces-inside: 1
    min-spaces-inside-empty: 0
    max-spaces-inside-empty: 0

  brackets:
    level: error
    forbid: false
    min-spaces-inside: 0
    max-spaces-inside: 0
    min-spaces-inside-empty: 0
    max-spaces-inside-empty: 0

  colons:
    level: error
    max-spaces-before: 0
    max-spaces-after: 1

  commas:
    level: error
    max-spaces-before: 0
    min-spaces-after: 1
    max-spaces-after: 1

  comments:
    level: error
    require-starting-space: true
    ignore-shebangs: true
    min-spaces-from-content: 2

  comments-indentation:
    level: warning

  document-end: false

  document-start:
    level: error
    present: true

  empty-lines:
    level: error
    max: 2
    max-start: 0
    max-end: 0

  empty-values:
    level: error
    forbid-in-block-mappings: true
    forbid-in-flow-mappings: true
    forbid-in-block-sequences: true

  float-values:
    level: error
    forbid-inf: true
    forbid-nan: true
    forbid-scientific-notation: true
    require-numeral-before-decimal: true

  hyphens:
    level: error
    max-spaces-after: 1

  indentation:
    level: error
    spaces: 2
    indent-sequences: true
    check-multi-line-strings: false

  key-duplicates:
    level: error
    forbid-duplicated-merge-keys: true

  key-ordering: false

  line-length:
    level: warning
    max: 180
    allow-non-breakable-words: true
    allow-non-breakable-inline-mappings: true

  new-line-at-end-of-file:
    level: error

  new-lines:
    level: error
    type: unix

  octal-values:
    level: error
    forbid-implicit-octal: true
    forbid-explicit-octal: true

  quoted-strings:
    level: warning
    quote-type: any
    required: only-when-needed
    allow-quoted-quotes: false
    extra-required: []
    extra-allowed:
      - ^http://
      - ^https://
      - ^ftp://
    check-keys: true

  trailing-spaces:
    level: error

  truthy:
    level: error
    allowed-values:
      - "true"
      - "false"
    check-keys: true
