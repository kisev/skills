#:schema https://mise.jdx.dev/schema/mise.json

# https://mise.jdx.dev/configuration.html

min_version = "2026.10.10"

[settings]
  disable_backends = ["asdf", "vfox"]

  [settings.npm]
    package_manager = "npm"

# tombi: format.rules.table-keys-order = "ascending"
[tools]
  "aqua:BurntSushi/ripgrep" = "15.2.0"
  "aqua:astral-sh/uv" = "0.13.5"
  "aqua:evilmartians/lefthook" = "2.2.2"
  "aqua:gitleaks/gitleaks" = "8.30.1"
  "aqua:go-task/task" = "3.54.0"
  "aqua:jqlang/jq" = "1.8.2"
  "aqua:koalaman/shellcheck" = "0.11.0"
  "aqua:mikefarah/yq" = "4.54.1"
  "aqua:mvdan/sh" = "3.14.1"
  "aqua:rhysd/actionlint" = "1.7.12"
  "aqua:sharkdp/fd" = "10.5.0"
  "aqua:tombi-toml/tombi" = "1.9.3"
  "core:node" = "26.12.1"
  "core:python" = ["3.12.15", "3.13.17", "3.14.9", "3.15.1"]
  "github:agent-sh/agnix" = "0.59.3"
  "github:editorconfig-checker/editorconfig-checker" = "4.0.2"
  "gitlab:gitlab-org/cli" = "1.124.0"
  "npm:@commitlint/cli" = "21.2.4"
  "npm:@fission-ai/openspec" = "1.15.0"
  "npm:agent-browser" = "0.39.2"
  "npm:markdownlint-cli2" = "0.24.0"
  "npm:oxfmt" = "0.74.0"
  "npm:oxlint" = "1.89.0"
  "npm:remark-cli" = { version = "12.0.1", npm_args = "remark-gfm@4.0.1 remark-frontmatter@5.0.0" }
  "npm:skills" = "1.7.4"
  "npm:typescript" = "7.0.2"
  "pipx:yamllint" = "1.38.0"
