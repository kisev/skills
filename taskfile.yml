---
version: "3"

set: [pipefail, errexit, nounset]

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  tools:
    desc: Show the pinned toolchain
    cmds:
      - mise ls --current --local

  spec:check:
    desc: Validate canonical specs and traceability
    cmds:
      - uv run --locked python scripts/check_specs.py

  spec:skill:
    desc: Print a read-only canonical report for one skill
    cmds:
      - uv run --locked python scripts/check_specs.py --skill "{{.CLI_ARGS}}"

  spec:impact:
    desc: Check spec impact for a commit range
    cmds:
      - uv run --locked python scripts/check_specs.py --range "{{.BASE}}" "{{.HEAD}}"

  spec:audit:
    desc: Run the read-only semantic specification audit
    cmds:
      - uv run --locked python scripts/spec_audit.py --critic-pass

  format:
    desc: Format canonical maintained sources and regenerate assets
    cmds:
      - uv run --locked ruff format scripts shared/references tests skills
      - prettier --write .
      - tombi format --offline mise.toml pyproject.toml tombi.toml
      - task: package:format
      - task: generate

  format:check:
    desc: Check formatting without changing tracked files
    cmds:
      - task: format:repository:check
      - task: package:format:check

  format:repository:check:
    internal: true
    cmds:
      - uv run --locked ruff format --check scripts shared/references tests skills
      - prettier --check .
      - tombi format --offline --check mise.toml pyproject.toml tombi.toml

  lint:
    desc: Run source, document, data, workflow, and shell linters
    cmds:
      - task: lint:repository
      - oxlint packages/opencode/src packages/opencode/test

  lint:repository:
    internal: true
    cmds:
      - uv run --locked ruff check scripts shared/references tests skills
      - markdownlint-cli2
      - uv run --locked yamllint .github lefthook.yml taskfile.yml .yamllint.yml
      - actionlint
      - task: lint:data
      - task: lint:shell

  lint:data:
    internal: true
    cmds:
      - fd --hidden --type f --extension json --exclude node_modules --exclude dist --exec jq empty
      - >-
        yq --exit-status '.' .github/workflows/ci.yml .github/workflows/publish.yml
        lefthook.yml taskfile.yml .yamllint.yml >/dev/null
      - >-
        rg --files --hidden -g '*.toml' -g '!packages/opencode/node_modules/**'
        | xargs tombi lint --offline

  lint:shell:
    internal: true
    cmds:
      - fd --hidden --type f --extension sh --exclude node_modules --exec shfmt -d
      - fd --hidden --type f --extension sh --exclude node_modules --exec shellcheck

  typecheck:
    desc: Run strict Python and TypeScript type checks
    cmds:
      - task: typecheck:python
      - task: package:typecheck

  typecheck:python:
    internal: true
    cmds:
      - uv run --locked mypy

  test:
    desc: Run Python and Node contract tests
    cmds:
      - task: test:python
      - task: package:test

  test:python:
    internal: true
    cmds:
      - SKILLS_BINARY="$(mise which skills)" uv run --locked pytest

  generate:
    desc: Materialize source copies and build untracked artifacts
    cmds:
      - task: generate:source
      - task: build:skills
      - task: build:distribution
      - task: package:generate

  generate:check:
    desc: Check source parity and generated artifacts without writing them
    cmds:
      - task: generate:source:check
      - task: generate:distribution:check
      - task: package:generate:check

  generate:source:
    internal: true
    cmds:
      - uv run --locked python scripts/build_skills.py --generate

  generate:source:check:
    internal: true
    cmds:
      - uv run --locked python scripts/build_skills.py --check

  build:skills:
    internal: true
    cmds:
      - uv run --locked python scripts/build_skills.py

  build:distribution:
    internal: true
    cmds:
      - uv run --locked python scripts/build_distribution.py

  generate:distribution:check:
    internal: true
    cmds:
      - uv run --locked python scripts/build_distribution.py --check

  skills:validate:
    desc: Validate Agent Skills with complementary validators
    deps: [build:skills]
    cmds:
      - uv run --locked python scripts/check_agnix.py
      - for:
          var: SKILLS
        cmd: uv run --locked agentskills validate "{{.ITEM}}"
      - uv run --locked pytest tests/test_skill_contracts.py
    vars:
      SKILLS:
        sh: fd --type f --glob 'SKILL.md' .build/skills --exec dirname | sort

  locale:check:
    desc: Validate translated public documentation and materialized references
    cmds:
      - uv run --locked python scripts/check_locales.py
      - uv run --locked python scripts/build_skills.py --check
      - uv run --locked python scripts/check_locales.py --built .build/skills

  package:check:
    desc: Verify the complete OpenCode package lifecycle and tarball
    deps: [build:skills]
    dir: packages/opencode
    cmds:
      - npm ci
      - npm run format:check
      - npm run lint
      - npm run typecheck
      - npm run generate-assets:check
      - npm test
      - npm run smoke
      - node test/pack-allowlist.mjs

  eval:check:
    desc: Validate behavioral eval schemas and run the hostless deterministic suite
    cmds:
      - uv run --locked python scripts/eval_runner.py --validate
      - uv run --locked python scripts/eval_runner.py --offline

  security:
    desc: Scan the repository for committed secrets
    cmds:
      - gitleaks git --config .gitleaks.toml --redact --no-banner
      - gitleaks dir . --config .gitleaks.toml --redact --no-banner

  check:
    desc: Run the complete local and CI quality gate
    cmds:
      - task: format:repository:check
      - task: spec:check
      - task: lint:repository
      - task: typecheck:python
      - task: test:python
      - task: locale:check
      - task: generate:source:check
      - task: skills:validate
      - task: eval:check
      - task: package:check
      - task: security

  pre-commit:
    desc: Run path-scoped non-mutating checks for staged files
    cmds:
      - uv run --locked python scripts/precommit.py

  pre-push:
    desc: Run the complete quality gate before push
    cmds:
      - task: check

  package:format:
    internal: true
    dir: packages/opencode
    cmds:
      - npm run format

  package:format:check:
    internal: true
    dir: packages/opencode
    cmds:
      - npm run format:check

  package:typecheck:
    internal: true
    dir: packages/opencode
    deps: [package:install]
    cmds:
      - npm run typecheck

  package:test:
    internal: true
    dir: packages/opencode
    deps: [package:install]
    cmds:
      - npm test

  package:generate:
    internal: true
    dir: packages/opencode
    deps: [package:install]
    cmds:
      - npm run generate-assets

  package:generate:check:
    internal: true
    dir: packages/opencode
    deps: [package:install]
    cmds:
      - npm run generate-assets:check

  package:install:
    internal: true
    dir: packages/opencode
    cmds:
      - npm ci
